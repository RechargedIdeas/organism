[project]
name = "organism-sdk"
version = "0.4.0"
description = "Organism Python authoring SDK (A3.1)"
requires-python = ">=3.11"
dependencies = [
  "protobuf>=5.26",
  "grpcio>=1.62",
  "pydantic>=2.6",
  "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["organism_sdk"]
