[project]
name = "organism-sdk"
version = "1.11.0"
description = "Organism Python authoring SDK (A3.1)"
requires-python = ">=3.11"
dependencies = [
  "protobuf>=5.26",
  "grpcio>=1.62",
  "cryptography>=42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["organism_sdk"]
