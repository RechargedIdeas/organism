name: Organism nightly

# Manual counterpart of the local nightly task (ci/schedule/windows_nightly.ps1). Runs the nightly
# tier, which adds the slow wall-clock and soak suites on top of the full tier, and an advisory
# dependency audit. The audit never fails the run, so a newly published advisory cannot block the
# nightly signal; it shows up in the job log and the run is marked with a warning.
#
# No schedule. The nightly runs on the Windows host (OrganismNightlyCI, 02:00), and a scheduled
# run here would spend Actions minutes on the same signal (GAP_ANALYSIS.md, N1). Start this one by
# hand from the Actions tab when a second host's view is wanted. The dependency audit therefore
# runs only when this workflow is started by hand.

on:
  workflow_dispatch:

# Read-only token for every job. A job that needs more has to ask for it.
permissions:
  contents: read

concurrency:
  group: organism-nightly
  cancel-in-progress: false

jobs:
  nightly:
    name: Nightly tier (slow suites)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The nightly tier includes the full tier's Kotlin gate, which needs JDK 17 (see ci.yml).
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: System packages (protoc, Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libprotobuf-dev \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev,desktop]" -c constraints-dev.txt
      # The same jail grant as ci.yml. Without it the jail tests fail on this image, as they do on ci.yml.
      - name: Allow user namespaces for the jail tests
        uses: ./.github/actions/jail-userns
      - name: Nightly tier
        run: .venv/bin/python ci/run.py run --tier nightly
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-report
          path: ci/runs
          if-no-files-found: ignore
          retention-days: 7

  dependency-audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - name: Install the locked Python environment
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev,desktop]" pip-audit==2.9.0 -c constraints-dev.txt
      - name: Python advisories (pip-audit)
        run: .venv/bin/pip-audit --progress-spinner off
      - name: Install cargo-audit
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-audit
      - name: Rust advisories (cargo audit)
        run: cargo audit
