name: Organism nightly

# Scheduled counterpart of the local nightly task (ci/schedule/windows_nightly.ps1). Runs the nightly
# tier, which adds the slow wall-clock and soak suites on top of the full tier, and an advisory
# dependency audit. The audit never fails the run, so a newly published advisory cannot block the
# nightly signal; it shows up in the job log and the run is marked with a warning.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: organism-nightly
  cancel-in-progress: false

jobs:
  nightly:
    name: Nightly tier (slow suites)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: System packages (protoc, Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libprotobuf-dev \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev,desktop]"
      - name: Nightly tier
        run: .venv/bin/python ci/run.py run --tier nightly
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-report
          path: ci/runs
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the locked Python environment
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev,desktop]" pip-audit==2.9.0
      - name: Python advisories (pip-audit)
        run: .venv/bin/pip-audit --progress-spinner off
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Rust advisories (cargo audit)
        run: cargo audit
