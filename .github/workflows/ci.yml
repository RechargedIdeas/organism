name: Organism CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: organism-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The local pipeline's full tier (ci/run.py) on Linux: the same gates a developer runs before
  # pushing, plus the desktop smoke test. Hooks are per clone, so this job is the check that applies
  # to every push. It covers what the separate Python and Rust jobs used to run: pytest (not slow)
  # through suite:fast, the sandbox self-check, the v17-v110 gates, cargo test --workspace --lib
  # through v10:rust, and desktop:smoke, which only the full tier runs.
  pipeline:
    name: Local pipeline (full tier)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: System packages (protoc, Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libprotobuf-dev \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev,desktop]"
      - name: Full tier
        run: .venv/bin/python ci/run.py run --tier full
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: ci/runs
          if-no-files-found: ignore

  # OPTIONAL — Docker is NOT required for Organism. Main gates never need Docker.
  # This job is allow-fail so a registry/daemon flake cannot red the required checks.
  docker_optional:
    name: Optional container image (Docker example)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [pipeline]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build OCI image via Containerfile (Docker backend example)
        run: docker build -f deploy/container/Containerfile -t organism:cpu .
