name: Organism CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token for every job. A job that needs more has to ask for it.
permissions:
  contents: read

concurrency:
  group: organism-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The local pipeline's full tier (ci/run.py) on Linux: the same gates a developer runs before
  # pushing, plus the desktop smoke test. Hooks are per clone, so this job is the check that applies
  # to every push. It covers what the separate Python and Rust jobs used to run: pytest (not slow)
  # through suite:fast, the sandbox self-check, the v17-v110 gates, cargo test --workspace --lib
  # through v10:rust, and desktop:smoke, which only the full tier runs.
  pipeline:
    name: Local pipeline (full tier)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The Kotlin gate runs Gradle 8.11.1, which does not run on JDK 25. The runner's default JDK
      # is newer than that, so pin the JDK 17 that the Kotlin SDK is built and tested with locally.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: System packages (protoc, Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libprotobuf-dev \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -e ".[dev,desktop]" -c constraints-dev.txt
      # The jail tests need user namespaces with loopback up inside them. The composite action grants
      # that to the venv interpreter alone, through an AppArmor profile, and leaves the system restriction on.
      - name: Allow user namespaces for the jail tests
        uses: ./.github/actions/jail-userns
      - name: Full tier
        run: .venv/bin/python ci/run.py run --tier full
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-report
          path: ci/runs
          if-no-files-found: ignore
          retention-days: 7

  # OPTIONAL — Docker is NOT required for Organism. Main gates never need Docker.
  # This job is allow-fail so a registry/daemon flake cannot red the required checks.
  docker_optional:
    name: Optional container image (Docker example)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [pipeline]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build OCI image via Containerfile (Docker backend example)
        run: docker build -f deploy/container/Containerfile -t organism:cpu .
