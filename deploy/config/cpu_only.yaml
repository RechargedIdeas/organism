# Organism single-device CPU-only profile (alias of bare_metal defaults)
# No GPU required. Hybrid / bio adapters optional. Docker NOT required.
version: 1
profile: cpu_only
host_kind: bare_metal
runtime:
  prefer_gpu: false
  enable_bio_digital: false
  enable_neuro_sim: false
  hybrid_root: null   # or path; null = do not require Hybrid checkout
stack:
  register_deterministic: true
  register_learned: true
  workspace_write_tags: ["*"]
  workspace_read_tags: ["*"]
  router_level: L0
health:
  host: "127.0.0.1"
  port: 8787
  path: "/health"
  status_path: "/status"
serve:
  dry_run: false
  bind_background: true
