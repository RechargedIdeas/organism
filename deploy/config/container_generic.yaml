# Organism generic container profile (v1.10)
# Works with Docker, Podman, CRI-O, containerd — Docker is ONE optional backend.
# Prefer deploy/container/Containerfile (Docker-and-Podman friendly).
version: 1
profile: container_generic
host_kind: container
runtime:
  prefer_gpu: false
  enable_bio_digital: false
  enable_neuro_sim: false
  hybrid_root: null
stack:
  register_deterministic: true
  register_learned: true
  workspace_write_tags: ["*"]
  workspace_read_tags: ["*"]
  router_level: L0
health:
  host: "0.0.0.0"
  port: 8787
  path: "/health"
  status_path: "/status"
serve:
  dry_run: false
  bind_background: true
sandbox:
  self_sandbox: true
  # Nested namespaces often unavailable inside containers — degrade gracefully
  use_namespaces: false
