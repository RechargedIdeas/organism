# Organism default deploy profile (v1.6)
# CPU-first; same stack as cpu_only with a distinct profile label + health port
# so Desktop multi-profile switching shows a clear status_facts delta.
version: 1
profile: default
runtime:
  prefer_gpu: false
  enable_bio_digital: false
  enable_neuro_sim: false
  hybrid_root: null
stack:
  register_deterministic: true
  register_learned: true
  workspace_write_tags: ["*"]
  workspace_read_tags: ["*"]
  router_level: L0
health:
  host: "127.0.0.1"
  port: 8788
  path: "/health"
  status_path: "/status"
serve:
  dry_run: false
  bind_background: true
