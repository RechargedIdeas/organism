[workspace]
resolver = "2"
members = [
    "sdk/rust/organism-proto",
    "sdk/rust/organism-client",
    "runtime/registry",
    "runtime/workspace",
    "runtime/router",
    "runtime/degradation",
    "runtime/control_loop",
    "modules/kernel",
    "modules/hdc",
    "harness/runner",
    "harness/injector",
    "harness/observer",
    "harness/assertions",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["Organism Contributors"]

[workspace.dependencies]
tokio = { version = "1.36", features = ["full"] }
tonic = "0.11"
prost = "0.12"
prost-types = "0.12"
tonic-build = "0.11"
prost-build = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
blake3 = "1.5"
sha2 = "0.10"
ed25519-dalek = "2.1"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono"] }
uuid = { version = "=1.11.0", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = "0.13"
async-trait = "0.1"
dashmap = "5.5"
parking_lot = "0.12"
smallvec = "1.13"
bitvec = "1.0"
