[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "organism"
version = "1.11.0"
description = "Organism — homeostatic computational ecology substrate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Organism Contributors" }]

dependencies = [
    "protobuf>=5.26",
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "numpy>=1.26",
    "cryptography>=42.0",
]

[project.scripts]
organism = "organism_sdk.cli:main"
organism-desktop = "organism_desktop.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.2",
    "black>=24.1",
    "pyyaml>=6.0",
]
desktop = [
    "PySide6>=6.6",
]

[tool.hatch.build.targets.wheel]
packages = [
    "sdk/python/organism_sdk",
    "modules/deterministic_engine",
    "modules/learned_module",
    "modules/_common",
    "modules/organism_modules",
    "modules/reservoir",
    "modules/hdc_module",
    "modules/kernel_module",
    "modules/energy_hopfield",
    "modules/spectral",
    "modules/snn_sentinel",
    "modules/neurosymbolic",
    "desktop/organism_desktop",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "sdk/python/organism_sdk/_proto"
exclude = ['(^|[\/])_proto[\/]']

# Generated protobuf code is not hand-written and is regenerated by the proto gate.
[[tool.mypy.overrides]]
module = ["organism_sdk._proto", "organism_sdk._proto.*", "organism.*"]
follow_imports = "silent"
ignore_errors = true

# Optional accelerator dependency: imported only when present.
[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true

# In-repo packages under modules/ ship without a py.typed marker, so their types are Any here.
[[tool.mypy.overrides]]
module = [
    "learned_module", "learned_module.*",
    "snn_sentinel", "snn_sentinel.*",
    "bio_digital", "bio_digital.*",
    "_common", "_common.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "modules", "harness", "sdk/python/tests", "desktop/tests", "bench/tests"]
pythonpath = ["sdk/python", "modules", "desktop", "ci", "bench"]
markers = [
    "slow: full wall-clock SLO or extended soak; opt-in via ORGANISM_WALL_CLOCK_FULL=1 / ORGANISM_SOAK_FULL=1",
    "cpu_everywhere: CPU fallback / no-accelerator product guarantee",
    "desktop: Organism Desktop GUI tests",
]
