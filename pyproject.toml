[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "organism"
version = "1.7.2"
description = "Organism — homeostatic computational ecology substrate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Organism Contributors" }]

dependencies = [
    "protobuf>=5.26",
    "grpcio>=1.62",
    "grpcio-tools>=1.62",
    "pydantic>=2.6",
    "numpy>=1.26",
    "blake3>=0.4",
    "cryptography>=42.0",
    "structlog>=24.1",
]

[project.scripts]
organism = "organism_sdk.cli:main"
organism-desktop = "organism_desktop.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.2",
    "black>=24.1",
]
desktop = [
    "PySide6>=6.6",
]

[tool.hatch.build.targets.wheel]
packages = [
    "sdk/python/organism_sdk",
    "modules/deterministic_engine",
    "modules/learned_module",
    "desktop/organism_desktop",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "modules", "harness", "sdk/python/tests", "desktop/tests"]
pythonpath = ["sdk/python", "modules", "desktop"]
markers = [
    "slow: full wall-clock SLO or extended soak; opt-in via ORGANISM_WALL_CLOCK_FULL=1 / ORGANISM_SOAK_FULL=1",
    "cpu_everywhere: CPU fallback / no-accelerator product guarantee",
    "desktop: Organism Desktop GUI tests",
]
